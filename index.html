<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petrol Bowser Sign</title>

  <!-- 7-segment LED display font (used in config inputs) -->
  <link href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" rel="stylesheet">
  <!-- Kode Mono (used for sign price digits) -->
  <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Rough.js for hand-drawn annotations -->
  <script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background: #b8b49a; /* match bottom of body gradient so no white strip in iframes */
    }

    body {
      min-height: 100vh;
      background: linear-gradient(175deg, #9db8cc 0%, #b8cfd8 45%, #c4c8b4 70%, #b8b49a 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Arial Narrow', Arial, sans-serif;
      gap: 60px;
      padding: 40px;
      flex-wrap: wrap;
      overflow-x: hidden;
    }

    /* ── 3-D scene ──────────────────────────────────────────────── */
    .scene {
      perspective: 1600px;
      perspective-origin: 65% 70%;
    }

    .sign-wrap {
      transform: rotateY(-8deg) rotateX(4deg);
      transform-style: preserve-3d;
      position: relative;
      filter:
        drop-shadow(16px 28px 32px rgba(0,0,0,0.50))
        drop-shadow(0px  4px  6px rgba(0,0,0,0.25));
    }

    /* ── Sign face ──────────────────────────────────────────────── */
    .sign-face {
      width: 290px;
      border-radius: 4px 4px 3px 3px;
      overflow: hidden;
      box-shadow:
        inset 3px  4px 10px rgba(255,255,255,0.30),
        inset -3px -4px 10px rgba(0,0,0,0.15);
    }

    /* ── Right-hand depth face ──────────────────────────────────── */
    .sign-depth {
      position: absolute;
      top: 0; right: 0;
      width: 22px; height: 100%;
      background: linear-gradient(90deg, #888 0%, #666 100%);
      transform: rotateY(90deg);
      transform-origin: right center;
      backface-visibility: hidden;
    }

    /* ── Logo panel ─────────────────────────────────────────────── */
    .logo-panel {
      background: #f0cf61;
      padding: 20px 16px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 3px solid #b8b7b5;
      position: relative;
    }

    .logo-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255,255,255,0.42) 0%, transparent 45%);
      pointer-events: none;
    }

    .logo-img {
      width: 85%;
      max-width: 320px;
      position: relative;
      z-index: 1;
    }

    /* ── Price rows ─────────────────────────────────────────────── */
    .price-row {
      border-bottom: 2px solid #b2b1af;
      background: linear-gradient(150deg, #e6e5e3 0%, #d5d4d2 100%);
      padding: 0;
      position: relative;
    }

    .price-row::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,0.18) 0%, transparent 40%);
      pointer-events: none;
    }

    .row-inner {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      gap: 8px;
    }

    .row-label-block {
      flex: 1;
      min-width: 0;
    }

    .label-type {
      font-size: 13px;
      font-weight: 700;
      color: #4a00c3;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .label-unit {
      font-size: 9px;
      font-weight: 700;
      color: #4a00c3;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    /* ── LED display ────────────────────────────────────────────── */
    .led-display {
      background: #0a0a0a;
      border-radius: 3px;
      border: 1.5px solid #252525;
      padding: 5px 10px 5px 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.6);
      width: 170px;
      flex-shrink: 0;
    }

    .led-display::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 35%;
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);
      pointer-events: none;
    }

    .led-digits {
      font-family: 'Kode Mono', monospace;
      font-size: 50px;
      font-weight: 300;
      color: #ff2200;
      text-shadow:
        0 0  4px #ff4422,
        0 0 10px #ff2200,
        0 0 20px rgba(255, 60,  0, 0.70),
        0 0 40px rgba(255,  0,  0, 0.35),
        0 0 70px rgba(200,  0,  0, 0.15);
      line-height: 1;
      letter-spacing: 1px;
      animation: led-breathe 3.5s ease-in-out infinite;
    }

    .led-dot {
      letter-spacing: -6px;
      margin-left: -4px;
    }

    /* EV colour variants */
    .led-digits.led-blue {
      color: #2299ff;
      text-shadow:
        0 0  4px #44aaff,
        0 0 10px #2299ff,
        0 0 20px rgba(34, 153, 255, 0.70),
        0 0 40px rgba(34, 120, 255, 0.35),
        0 0 70px rgba(20, 80, 200, 0.15);
    }
    .led-digits.led-teal {
      color: #00ccaa;
      text-shadow:
        0 0  4px #33ddbb,
        0 0 10px #00ccaa,
        0 0 20px rgba(0, 204, 170, 0.70),
        0 0 40px rgba(0, 180, 150, 0.35),
        0 0 70px rgba(0, 140, 120, 0.15);
    }
    .led-digits.led-green {
      color: #44ee22;
      text-shadow:
        0 0  4px #66ff44,
        0 0 10px #44ee22,
        0 0 20px rgba(68, 238, 34, 0.70),
        0 0 40px rgba(40, 200, 20, 0.35),
        0 0 70px rgba(20, 160, 10, 0.15);
    }

    /* Flicker-on animation for EV rows */
    @keyframes led-flicker-on {
      0%   { opacity: 0; }
      15%  { opacity: 0.7; }
      25%  { opacity: 0.1; }
      40%  { opacity: 0.9; }
      50%  { opacity: 0.3; }
      65%  { opacity: 1; }
      75%  { opacity: 0.6; }
      85%  { opacity: 1; }
      100% { opacity: 1; }
    }

    .led-digits.flicker-on {
      animation: led-flicker-on 0.6s ease-out forwards;
    }

    @keyframes led-breathe {
      0%, 100% { opacity: 1.00; }
      50%       { opacity: 0.92; }
    }

    /* ── Brand strip ────────────────────────────────────────────── */
    .brand-panel {
      background: linear-gradient(150deg, #4a00c3 0%, #2a00a3 100%);
      padding: 13px 16px 12px;
      text-align: center;
      border-top: 3px solid #f0cf61;
      position: relative;
    }

    .brand-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255,255,255,0.14) 0%, transparent 50%);
      pointer-events: none;
    }

    .brand-name {
      color: #ffffff;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }

    .brand-sub {
      color: rgba(255,255,255,0.75);
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .sign-column {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .prices-panel {
      font-family: 'Roboto', sans-serif;
      font-weight: 300;
      color: #555;
      font-size: 12px;
      background: #f0cf61;
      padding: 10px 16px;
      border-top: 2px solid #b8b7b5;
    }

    .prices-panel h3 {
      font-size: 10px;
      font-weight: 600;
      color: #333;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0;
      cursor: pointer;
      user-select: none;
      text-align: center;
    }

    .prices-panel h3 .arrow {
      display: inline-block;
      font-size: 8px;
      transition: transform 0.2s;
      margin-left: 4px;
    }

    .prices-panel h3.open .arrow {
      transform: rotate(90deg);
    }

    .prices-panel .prices-body {
      display: none;
      margin-top: 10px;
    }

    .prices-panel .prices-body.open {
      display: block;
    }

    /* ── Config panel ───────────────────────────────────────────── */
    .config-panel {
      font-family: 'Roboto', sans-serif;
      font-weight: 300;
      color: #333;
      padding: 8px 0;
      font-size: 13px;
      width: 320px;
    }

    .config-heading {
      font-family: 'Roboto', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #222;
      line-height: 1.2;
      margin-bottom: 24px;
    }

    .hero-text {
      font-size: 18px;
      font-weight: 300;
      color: #333;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .hero-vehicle-wrap {
      position: relative;
      display: inline;
      padding: 4px;
    }

    .hero-select {
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      font-size: 18px;
      color: #4a00c3;
      background: transparent;
      border: none;
      cursor: pointer;
      appearance: auto;
      padding: 6px 8px;
      position: relative;
      z-index: 1;
    }

    .hero-select:focus { outline: none; }

    .hero-select optgroup {
      font-size: 13px;
      font-weight: 500;
      color: #666;
    }

    .hero-select option {
      font-size: 15px;
      font-weight: 400;
      color: #333;
    }

    .rough-box-svg {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .rough-inline-wrap {
      position: relative;
      display: inline-block;
      padding: 2px 4px;
    }

    .rough-highlight-svg {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
    }

    .savings-row.total .label,
    .savings-row.total .amount {
      position: relative;
      z-index: 1;
    }

    .hero-eff {
      font-size: 14px;
      font-weight: 300;
      color: #444;
      margin-bottom: 4px;
    }

    .ev-equiv {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(0,0,0,0.08);
    }

    .ev-equiv-label {
      font-size: 16px;
      font-weight: 300;
      color: #333;
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .ev-equiv-label strong {
      font-weight: 500;
      color: #4a00c3;
    }

    .config-section {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .config-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .config-section h3 {
      font-size: 10px;
      font-weight: 500;
      color: #4a00c3;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .price-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }

    .price-entry:last-child { margin-bottom: 0; }

    .price-entry input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: #ff4422;
      cursor: pointer;
      flex-shrink: 0;
    }

    .price-entry .entry-label {
      flex: 1;
      font-size: 12px;
      color: #444;
      line-height: 1.3;
    }

    .price-entry .entry-label .raw-unit {
      display: block;
      font-size: 9px;
      color: #666;
      letter-spacing: 0.05em;
    }

    input.price-input {
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      width: 68px;
      padding: 4px 7px;
      background: #fff;
      border: 1px solid #ccc;
      color: #4a00c3;
      border-radius: 4px;
      font-size: 13px;
      text-align: right;
      flex-shrink: 0;
    }

    input.price-input:focus {
      outline: none;
      border-color: #4a00c3;
      box-shadow: 0 0 0 2px rgba(74,0,195,0.15);
    }

    .config-note {
      font-size: 11px;
      color: #555;
      margin-top: 14px;
      line-height: 1.55;
      font-style: italic;
    }

    .config-explainer {
      font-size: 11px;
      color: #555;
      line-height: 1.5;
      margin-top: 8px;
    }

    .hero-inline-select {
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      font-size: 18px;
      color: #4a00c3;
      background: transparent;
      border: none;
      border-bottom: 2px solid #4a00c3;
      cursor: pointer;
      appearance: auto;
      padding: 2px 4px;
    }

    .hero-inline-select:focus { outline: none; }

    .hero-inline-select option {
      font-size: 15px;
      font-weight: 400;
      color: #333;
    }

    .savings-box {
      margin-top: 20px;
      padding: 16px;
      background: rgba(74, 0, 195, 0.04);
      border-radius: 8px;
      position: relative;
    }

    .savings-title {
      font-size: 11px;
      font-weight: 500;
      color: #4a00c3;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .savings-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .savings-row .label {
      font-weight: 300;
      color: #444;
    }

    .savings-row .amount {
      font-weight: 400;
      color: #333;
    }

    .savings-row.total {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(74, 0, 195, 0.15);
      font-size: 20px;
    }

    .savings-row.total .label {
      font-weight: 400;
      color: #333;
    }

    .savings-row.total .amount {
      font-weight: 500;
      color: #4a00c3;
    }

    .savings-breakdown {
      font-size: 10px;
      color: #555;
      margin-top: 8px;
      line-height: 1.5;
    }

    .prices-toggle {
      cursor: pointer;
      user-select: none;
    }

    .prices-toggle .arrow {
      display: inline-block;
      font-size: 8px;
      transition: transform 0.2s;
      margin-left: 4px;
    }

    .prices-toggle.open .arrow {
      transform: rotate(90deg);
    }

    .prices-body {
      display: none;
      margin-top: 10px;
    }

    .prices-body.open {
      display: block;
    }

    /* ── Action panel (full width below both columns) ──────── */
    .action-panel {
      flex-basis: 100%;
      max-width: 800px;
      min-width: 0;
      overflow: hidden;
      margin: 20px auto 0;
      padding: 36px 40px 40px;
      font-family: 'Roboto', sans-serif;
      font-weight: 300;
      color: #333;
      font-size: 13px;
      border-radius: 0;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 27px,
          rgba(120,120,140,0.07) 27px,
          rgba(120,120,140,0.07) 28px
        ),
        linear-gradient(135deg, #f5f0e8 0%, #ede7db 30%, #f2ece2 60%, #e8e2d6 100%);
      box-shadow:
        0 1px 4px rgba(0,0,0,0.08),
        inset 0 1px 0 rgba(255,255,255,0.6);
    }

    /* ── Take Action section ─────────────────────────────────── */
    .action-section {
      padding-top: 0;
    }

    .action-heading {
      font-family: 'Roboto', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #222;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .action-subtext {
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      font-weight: 300;
      color: #555;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .action-field {
      margin-bottom: 14px;
    }

    .action-field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #444;
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }

    .action-field input[type="text"],
    .action-field input[type="email"],
    .action-field input[type="number"] {
      font-family: 'Roboto', sans-serif;
      font-size: 15px;
      font-weight: 300;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      color: #333;
    }

    .action-field input:focus {
      outline: none;
      border-color: #4a00c3;
      box-shadow: 0 0 0 2px rgba(74,0,195,0.12);
    }

    .mp-result {
      font-size: 14px;
      color: #4a00c3;
      font-weight: 400;
      margin-top: 6px;
      min-height: 20px;
    }

    .mp-result a {
      color: #4a00c3;
      text-decoration: underline;
    }

    .recipients-list {
      font-size: 13px;
      color: #555;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .recipients-list .recipient {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .recipients-list .recipient-check {
      color: #4a00c3;
      font-weight: 500;
    }

    .policy-list {
      list-style: none;
      padding: 0;
      margin: 0 0 16px 0;
    }

    .policy-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 300;
      color: #333;
      line-height: 1.4;
    }

    .policy-list input[type="checkbox"] {
      margin-top: 3px;
      accent-color: #4a00c3;
      flex-shrink: 0;
      width: 16px;
      height: 16px;
    }

    .email-preview {
      background: #f8f6ff;
      border: 1px solid rgba(74,0,195,0.12);
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      font-weight: 300;
      color: #333;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
      max-height: 260px;
      overflow-y: auto;
      margin-bottom: 14px;
    }

    .action-btn {
      display: inline-block;
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      background: #4a00c3;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: #3500a0;
    }

    .action-btn.secondary {
      background: transparent;
      color: #4a00c3;
      border: 1.5px solid #4a00c3;
      margin-left: 8px;
    }

    .action-btn.secondary:hover {
      background: rgba(74,0,195,0.06);
    }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 768px) {
      body {
        padding: 20px 16px;
        gap: 30px;
      }
      .sign-face { width: min(290px, 80vw); }
      .config-panel { width: 100%; max-width: 400px; }
      .action-panel { max-width: 100%; padding: 24px 20px 28px; }
    }

  </style>
</head>
<body>

  <!-- ── Sign column (sign + prices underneath) ────────── -->
  <div class="sign-column">
    <div class="scene">
      <div class="sign-wrap">
        <div class="sign-face">

          <div class="logo-panel">
            <img class="logo-img" src="RA_ElectrifyEverything_Logo_Black.png" alt="Electrify Everything">
          </div>

          <div id="price-rows"></div>

          <div class="brand-panel">
            <div class="brand-name">Rewiring Australia</div>
            <div class="brand-sub">How much higher will petrol go?</div>
          </div>

          <div id="pricesPanel" class="prices-panel"></div>

        </div>
        <div class="sign-depth"></div>
      </div>
    </div>
  </div>

  <!-- ── Config panel ──────────────────────────────────────── -->
  <div class="config-panel" id="configPanel"></div>

  <!-- ── Action section (spans full width below both columns) ── -->
  <div class="action-panel" id="actionPanel" style="display: none;"></div>

  <script>
    // Feature flags — set to true (or add ?action=1 to URL) to show the "Email your MP" section
    const SHOW_ACTION = new URLSearchParams(location.search).has('action');

// MP data loaded dynamically via fetch
    window.pcToElec = {};
    window.elecToMp = {};

        // ─── Vehicle type data ───────────────────────────────────────────────────
    // Columns: small, med/large, sm/med SUV, large SUV, ute, van
    const vtypes = [
      // tankL: typical petrol tank litres, battKwh: typical EV battery kWh
      { id: 'small',    label: 'Small car',         examples: 'Corolla, i30, Mazda3, Swift',       evKwh: 14, evExamples: 'BYD Dolphin, MG4',                    defaultKmYear: 11000, tankL: 50,  battKwh: 50 },
      { id: 'medlarge', label: 'Medium / large car', examples: 'Camry, Commodore, Falcon, Accord',  evKwh: 16, evExamples: 'Tesla Model 3, BYD Seal',             defaultKmYear: 12000, tankL: 60,  battKwh: 60 },
      { id: 'smsuv',    label: 'Small / medium SUV', examples: 'RAV4, CX-5, Tucson, X-Trail',       evKwh: 17, evExamples: 'Tesla Model Y, BYD Atto 3, Ioniq 5',  defaultKmYear: 12500, tankL: 58,  battKwh: 62 },
      { id: 'lgsuv',    label: 'Large SUV / 4WD',    examples: 'LandCruiser, Prado, Kluger, Patrol', evKwh: 22, evExamples: 'BMW iX, Kia EV9',                     defaultKmYear: 14000, tankL: 80,  battKwh: 90 },

    // Pre-compute averaged tables keyed by range value
    function avgTable(raw) {

    const SPIN_DURATION   = 10000;        // ms – petrol climb
    const EV_REVEAL_AT    = 4000;         // ms – when first EV row flickers on
    const EV_STAGGER      = 400;          // ms between each EV row reveal
    const SPIN_START      = 175.0;        // starting price for petrol rows

      if (spinStart === null) spinStart = ts;

      fuelRows.forEach(row => {
        if (row.fuelType !== 'petrol') return;
        const target = row.rawPrice;
        const base = SPIN_START + (target - SPIN_START) * eased;
        if (t < 1) {
          animOverrides.set(row.name, base);
        } else {
          animOverrides.set(row.name, target);
        }
      });

      // Kick off EV reveals at 4s, independently of petrol finishing

        evRevealStarted = true;
        flickerOnEvRows();
      }

      renderSign();

      if (t < 1) {
        requestAnimationFrame(tickSpin);
      } else {

        animOverrides.clear();

        </div>

        <div class="savings-box">
          <div class="savings-title">Yearly fuel cost</div>
          <div class="savings-row">
            <span class="label">${fuelLabel} (${yearRanges.find(r => r.value === state.year).label} ${vt.label[0].toLowerCase() + vt.label.slice(1)})</span>
            <span class="amount">${fmt$(fuelCostYear)}</span>
          </div>
          <div class="savings-row">
            <span class="label">EV equivalent</span>
            <span class="amount">${fmt$(evCostYear)}</span>
          </div>
          <div class="savings-row total" style="position: relative;">
            <span class="label">You save</span>
            <span class="amount">${fmt$(savingsYear)} / year</span>
            <svg id="roughHighlight" class="rough-highlight-svg"></svg>
          </div>
          <div class="savings-breakdown">
            Based on ${kmYear.toLocaleString()} km/year, ${fuelLabel.toLowerCase()} at ${fuelPrice}¢/L.
            EV mix: ${[fastPct > 0 ? Math.round(fastPct*100) + '% fast charger' : '', gridPct > 0 ? Math.round(gridPct*100) + '% grid' : '', solarPct > 0 ? Math.round(solarPct*100) + '% solar' : ''].filter(Boolean).join(', ')}.
          </div>
          <svg id="roughSavingsBox" class="rough-box-svg"></svg>
        </div>

      `;

      if (!SHOW_ACTION) {
        document.getElementById('actionPanel').style.display = 'none';
      } else {
      document.getElementById('actionPanel').style.display = '';
      document.getElementById('actionPanel').innerHTML = `
        <div class="action-section">
          <h2 class="action-heading">Tell your MP you want action on EVs</h2>
          <p class="action-subtext">
            You could save <strong>${fmt$(savingsYear)} a year</strong>. Ask your representatives to support
            policies that make it easier for all Australians to go electric.
          </p>

          <div class="action-field">
            <label>Your name</label>
            <input type="text" id="actionName" value="${actionState.userName}"
              placeholder="e.g. Alex Smith" oninput="actionState.userName = this.value; updateEmailPreview()">
          </div>

          <div class="action-field">
            <label>Your email</label>
            <input type="email" id="actionEmail" value="${actionState.userEmail}"
              placeholder="alex@example.com" oninput="actionState.userEmail = this.value; updateEmailPreview()">
          </div>

          <div class="action-field">
            <label>Your postcode</label>
            <input type="text" inputmode="numeric" pattern="[0-9]{4}" id="actionPostcode" value="${actionState.postcode}"
              placeholder="e.g. 2000" style="width: 120px;"
              oninput="actionState.postcode = this.value"
              onkeydown="if(event.key==='Enter') lookupMP()">
            <button class="action-btn secondary" onclick="lookupMP()" style="padding: 6px 14px; font-size: 13px; margin-left: 8px; vertical-align: middle;">
              Find my MP
            </button>
            <div class="mp-result" id="mpResult">
              ${actionState.mpLookupDone && !actionState.mpName
                  ? 'Could not find MP. <a href="https://www.aph.gov.au/Senators_and_Members/Members" target="_blank">Look up manually</a>'
                  : ''}
            </div>
          </div>

          <div class="recipients-list" id="recipientsList">
            <strong style="font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: #444;">Your email will go to:</strong><br>
            ${actionState.mpName
              ? `<div class="recipient"><span class="recipient-check">✓</span> <strong>The Hon ${actionState.mpName} MP</strong> (your MP${actionState.mpElectorate ? ', ' + actionState.mpElectorate : ''})</div>`
              : '<div class="recipient" style="color: #777; font-style: italic;">Enter your postcode above to add your local MP</div>'}
            ${ministers.map((m, i) => `
              <div class="recipient">
                <input type="checkbox" id="minister${i}" ${m.checked ? 'checked' : ''}
                  onchange="ministers[${i}].checked = this.checked; updateEmailPreview()"
                  style="margin-right: 6px; vertical-align: middle;">
                <label for="minister${i}" style="cursor: pointer;">${m.name} (${m.role})</label>
              </div>
            `).join('')}
          </div>

          <div style="margin-bottom: 16px;">
            <strong style="font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: #444;">I want to call for:</strong>
            <ul class="policy-list" style="margin-top: 8px;">
              ${policies.map((p, i) => `
                <li>
                  <input type="checkbox" id="policy${i}" ${p.checked ? 'checked' : ''}
                    onchange="policies[${i}].checked = this.checked; updateEmailPreview()">
                  <label for="policy${i}" style="cursor: pointer;">${p.label}</label>
                </li>
              `).join('')}
            </ul>
          </div>

          <div id="emailPreview" class="email-preview">${composeEmail(savingsYear)}</div>

          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <a id="mailtoLink" class="action-btn" href="${buildMailto(savingsYear)}" style="text-align: center;">
              Open in my email app
            </a>
            <button class="action-btn secondary" onclick="copyEmail()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy email text
            </button>
          </div>
        </div>

      `;
      } // end SHOW_ACTION

      // Draw rough.js box around the select
      requestAnimationFrame(() => {
        drawRoughBox();
        observeRoughTargets();
        reportHeight();
      });
    }

    function drawRoughBox() {
      if (typeof rough === 'undefined') return;

      // Draw rough boxes around all wraps that contain an SVG
      document.querySelectorAll('.hero-vehicle-wrap, .rough-inline-wrap').forEach(wrap => {
        const svg = wrap.querySelector('.rough-box-svg');
        if (!svg) return;
        const w = wrap.offsetWidth;
        const h = wrap.offsetHeight;
        svg.setAttribute('width', w);
        svg.setAttribute('height', h);
        svg.innerHTML = '';
        const rc = rough.svg(svg);
        svg.appendChild(rc.rectangle(2, 2, w - 4, h - 4, {
          stroke: '#4a00c3', strokeWidth: 1.5, roughness: 1.5, bowing: 1.5,
        }));
      });

      // Fillup comparison cards
      document.querySelectorAll('.fillup-card').forEach(card => {
        const svg = card.querySelector('.fillup-rough');
        if (!svg) return;
        const w = card.offsetWidth;
        const h = card.offsetHeight;
        svg.setAttribute('width', w);
        svg.setAttribute('height', h);
        svg.innerHTML = '';
        const rc = rough.svg(svg);
        const isEv = card.querySelector('div').textContent.includes('EV');
        svg.appendChild(rc.rectangle(2, 2, w - 4, h - 4, {
          stroke: isEv ? '#0d6e2d' : '#991100', strokeWidth: 1.8, roughness: 2, bowing: 1.5,
        }));
      });

      // Savings outer box
      const savingsWrap = document.querySelector('.savings-box');
      const savingsSvg = document.getElementById('roughSavingsBox');
      if (savingsWrap && savingsSvg) {
        const w = savingsWrap.offsetWidth;
        const h = savingsWrap.offsetHeight;
        savingsSvg.setAttribute('width', w);
        savingsSvg.setAttribute('height', h);
        savingsSvg.innerHTML = '';
        const rc = rough.svg(savingsSvg);
        savingsSvg.appendChild(rc.rectangle(2, 2, w - 4, h - 4, {
          stroke: '#4a00c3', strokeWidth: 2, roughness: 1.8, bowing: 2,
        }));
      }

      // Yellow highlighter on "You save" row
      const highlightRow = document.querySelector('.savings-row.total');
      const highlightSvg = document.getElementById('roughHighlight');
      if (highlightRow && highlightSvg) {
        const w = highlightRow.offsetWidth;
        const h = highlightRow.offsetHeight;
        highlightSvg.setAttribute('width', w);
        highlightSvg.setAttribute('height', h);
        highlightSvg.innerHTML = '';
        const rc = rough.svg(highlightSvg);
        highlightSvg.appendChild(rc.rectangle(0, h * 0.25, w, h * 0.6, {
          fill: '#f0cf61',
          fillStyle: 'solid',
          stroke: 'none',
          roughness: 2.5,
          bowing: 2,
        }));
      }
    }

    // ─── Event handlers ───────────────────────────────────────────────────────
    function setType(idx) {
      state.typeIdx = parseInt(idx);
      // Auto-set fuel type based on defaults
      const ft = defaultFuelType(state.typeIdx, state.year);
      if (ft === 'diesel') state.fuelIdx = 2;
      else if (ft === 'petrol') state.fuelIdx = 0;
      else state.fuelIdx = defaultFuelPreselect(state.typeIdx) === 'diesel' ? 2 : 0;
      rebuildSign();
      renderConfig();
    }

    function setYear(y) {
      state.year = y;
      rebuildSign();
      renderConfig();
    }

    function setFuel(idx) {
      state.fuelIdx = parseInt(idx);
      rebuildSign();
      renderConfig();
    }

    function setKm(idx) {
      state.kmIdx = parseInt(idx);
      renderConfig();
    }

    function setCustomKm(val) {
      const n = parseInt(val);
      if (n > 0) {
        state.customKm = n;
        renderConfig();
      }
    }

    function setSolar(val) {
      state.solarMode = val;
      renderConfig();
    }

    function togglePrices() {
      const toggle = document.querySelector('.prices-toggle');
      const body = document.getElementById('pricesBody');
      toggle.classList.toggle('open');
      body.classList.toggle('open');
    }

    function updateRawPrice(i, val) {
      const v = parseFloat(val);
      if (!isNaN(v) && v >= 0) { fuelRows[i].rawPrice = v; rebuildSign(); renderConfig(); }
    }

    // ─── Email composition ────────────────────────────────────────────────────
    function composeEmail(savingsYear) {
      const vt = vtypes[state.typeIdx];
      const fo = fuelOptions[state.fuelIdx];
      const name = actionState.userName || '[Your name]';
      const postcode = actionState.postcode || '[your postcode]';
      const fmt$ = (v) => '$' + Math.round(v).toLocaleString();

      // Build greeting from selected recipients
      const addressees = [];
      if (actionState.mpName) addressees.push('The Hon ' + actionState.mpName + ' MP');
      ministers.filter(m => m.checked).forEach(m => addressees.push(m.name));
      let greeting;
      if (addressees.length === 0) greeting = 'To whom it may concern';
      else if (addressees.length === 1) greeting = `Dear ${addressees[0]}`;
      else greeting = `Dear ${addressees.slice(0, -1).join(', ')} and ${addressees[addressees.length - 1]}`;

      const selectedPolicies = policies.filter(p => p.checked);
      const location = actionState.mpElectorate
        ? `the electorate of ${actionState.mpElectorate}`
        : `postcode ${postcode}`;

      let body = `${greeting},

My name is ${name} and I live in ${location}. I drive a ${vt.label[0].toLowerCase() + vt.label.slice(1)} and I've worked out that I could save ${fmt$(savingsYear)} a year by switching to an electric vehicle.

I'm writing to ask you to support policies that help all Australians access cleaner, cheaper transport:\n`;

      selectedPolicies.forEach(p => {
        body += `\n• ${p.label}`;
      });

      body += `\n
These savings would make a real difference to my household and many others across Australia. The transition to electric vehicles is an opportunity to cut emissions and reduce the cost of living at the same time.

I'd welcome the chance to hear your position on these issues.

Kind regards,
${name}${actionState.userEmail ? '\n' + actionState.userEmail : ''}`;

      return body;
    }

    function buildMailto(savingsYear) {
      const recipients = [];
      // Add MP email if we found one
      if (actionState.mpEmail) recipients.push(actionState.mpEmail);
      // Only include checked ministers
      ministers.filter(m => m.checked).forEach(m => recipients.push(m.email));

      const subject = encodeURIComponent('Support for Australians switching to electric vehicles');
      const body = encodeURIComponent(composeEmail(savingsYear));
      const to = recipients.join(',');

      return `mailto:${to}?subject=${subject}&body=${body}`;
    }

    function updateEmailPreview() {
      const vt = vtypes[state.typeIdx];
      const fo = fuelOptions[state.fuelIdx];
      const kmWeek = kmOptions[state.kmIdx].km ?? state.customKm;
      const kmYear = kmWeek * 52;
      const fuelPrice = fuelRows.find(r => r.name === fo.rowName).rawPrice;
      const fastPrice = fuelRows.find(r => r.name === 'Fast Charger').rawPrice;
      const gridPrice = fuelRows.find(r => r.name === 'Charge from Grid').rawPrice;
      const solarPrice = fuelRows.find(r => r.name === 'Solar Power').rawPrice;
      const litresYear = kmYear * petrolEff() / 100;
      const fuelCostYear = litresYear * fuelPrice / 100;
      const kwhYear = kmYear * evEff() / 100;
      const { fast: fastPct, grid: gridPct, solar: solarPct } = chargeMix();
      const evCostYear = kwhYear * (fastPct * fastPrice + gridPct * gridPrice + solarPct * solarPrice) / 100;
      const savingsYear = fuelCostYear - evCostYear;

      const preview = document.getElementById('emailPreview');
      const mailtoLink = document.getElementById('mailtoLink');
      if (preview) preview.textContent = composeEmail(savingsYear);
      if (mailtoLink) mailtoLink.href = buildMailto(savingsYear);
    }

    function lookupMP() {
      const input = document.getElementById('actionPostcode');
      if (input) actionState.postcode = input.value;
      const postcode = actionState.postcode;
      if (!postcode || postcode.length !== 4) {
        document.getElementById('mpResult').innerHTML = 'Please enter a 4-digit postcode.';
        return;
      }

      // Use embedded postcode → electorate → MP data
      const electorates = typeof pcToElec !== 'undefined' ? pcToElec[postcode] : null;
      if (!electorates || electorates.length === 0) {
        actionState.mpLookupDone = true;
        document.getElementById('mpResult').innerHTML =
          `Couldn't find that postcode. <a href="https://www.aph.gov.au/Senators_and_Members/Members" target="_blank">Look up your MP on aph.gov.au</a>`;
        return;
      }

      if (electorates.length === 1) {
        // Single electorate — resolve immediately
        const elec = electorates[0];
        const info = typeof elecToMp !== 'undefined' ? elecToMp[elec] : null;
        if (info) {
          actionState.mpName = info.mp;
          actionState.mpEmail = info.email;
          actionState.mpElectorate = elec;
          actionState.mpLookupDone = true;
          document.getElementById('mpResult').innerHTML = '';
          updateRecipientsList();
          updateEmailPreview();
        }
      } else {
        // Multiple electorates for this postcode — let user pick
        actionState.mpLookupDone = true;
        const options = electorates.map(e => {
          const info = elecToMp[e];
          return info ? `<option value="${e}">${e} — ${info.mp}</option>` : `<option value="${e}">${e}</option>`;
        }).join('');
        document.getElementById('mpResult').innerHTML =
          `This postcode covers multiple electorates:
          <br><select style="margin-top: 6px; font-family: Roboto, sans-serif; font-size: 14px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px;"
            onchange="selectElectorate(this.value)">
            <option value="">Choose your electorate…</option>
            ${options}
          </select>`;
      }
    }

    function selectElectorate(elec) {
      if (!elec) return;
      const info = typeof elecToMp !== 'undefined' ? elecToMp[elec] : null;
      if (info) {
        actionState.mpName = info.mp;
        actionState.mpEmail = info.email;
        actionState.mpElectorate = elec;
        updateRecipientsList();
        updateEmailPreview();
      }
    }

    function updateRecipientsList() {
      const el = document.getElementById('recipientsList');
      if (!el) return;
      el.innerHTML = `
        <strong style="font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: #444;">Your email will go to:</strong><br>
        ${actionState.mpName
          ? `<div class="recipient"><span class="recipient-check">✓</span> <strong>The Hon ${actionState.mpName} MP</strong> (your MP${actionState.mpElectorate ? ', ' + actionState.mpElectorate : ''})</div>`
          : '<div class="recipient" style="color: #777; font-style: italic;">Enter your postcode above to add your local MP</div>'}
        ${ministers.map((m, i) => `
          <div class="recipient">
            <input type="checkbox" id="minister${i}" ${m.checked ? 'checked' : ''}
              onchange="ministers[${i}].checked = this.checked; updateEmailPreview()"
              style="margin-right: 6px; vertical-align: middle;">
            <label for="minister${i}" style="cursor: pointer;">${m.name} (${m.role})</label>
          </div>
        `).join('')}
      `;
    }

    function copyEmail() {
      const preview = document.getElementById('emailPreview');
      if (preview) {
        const recipients = [];
        if (actionState.mpEmail) recipients.push(actionState.mpEmail);
        ministers.filter(m => m.checked).forEach(m => recipients.push(m.email));
        const to = recipients.join(', ');
        const subject = 'Support for Australians switching to electric vehicles';
        const text = `To: ${to}\nSubject: ${subject}\n\n${preview.textContent}`;
        navigator.clipboard.writeText(text).then(() => {
          const btn = event.target;
          const orig = btn.textContent;
          btn.textContent = 'Copied!';
          setTimeout(() => btn.textContent = orig, 2000);
        });
      }
    }

    // ─── Render prices panel (under the sign) ───────────────────────────────
    function renderPrices() {
      document.getElementById('pricesPanel').innerHTML = `
        <h3 class="prices-toggle" onclick="togglePrices()">
          Edit Energy Price Assumptions <span class="arrow">&#9654;</span>
        </h3>
        <div id="pricesBody" class="prices-body">
          ${fuelRows.map((row, i) => `
            <div class="price-entry">
              <span class="entry-label">
                ${row.name}
                <span class="raw-unit">${row.rawUnit}</span>
              </span>
              <input class="price-input" type="number" step="0.1" min="0"
                     value="${row.rawPrice}"
                     oninput="updateRawPrice(${i}, this.value)">
            </div>
          `).join('')}
          <p class="config-note" style="margin-top: 10px;">
            Current NSW prices from <a href="https://www.fuelcheck.nsw.gov.au/" target="_blank" rel="noopener" style="color: #4a00c3;">FuelCheck NSW</a>
          </p>
        </div>
      `;
    }

    // Redraw rough boxes only when observed elements actually change size
    const roughObserver = new ResizeObserver(entries => {
      // Debounce: only redraw once per frame
      if (!roughObserver._pending) {
        roughObserver._pending = true;
        requestAnimationFrame(() => {
          roughObserver._pending = false;
          drawRoughBox();
        });
      }
    });
    // Observe the containers whose size changes on layout shift
    function observeRoughTargets() {
      roughObserver.disconnect();
      document.querySelectorAll('.hero-vehicle-wrap, .rough-inline-wrap, .fillup-card, .savings-box, .savings-row.total').forEach(el => {
        roughObserver.observe(el);
      });
    }

    // ─── Iframe height reporting (for embedding in Webflow etc.) ────────────
    function reportHeight() {
      const h = document.documentElement.scrollHeight;
      window.parent.postMessage({ iframeHeight: h }, '*');
    }
    // Report on load, resize, and after any render
    window.addEventListener('load', reportHeight);
    new ResizeObserver(reportHeight).observe(document.body);

    // ─── Boot ─────────────────────────────────────────────────────────────────
    // Load MP postcode data asynchronously (only when action section is enabled)
    if (SHOW_ACTION) fetch('mp-data.json')
      .then(r => r.json())
      .then(data => {
        window.pcToElec = data.pcToElec || {};
        window.elecToMp = data.elecToMp || {};
      })
      .catch(e => console.warn('MP lookup data not available:', e));

    // Load admin config overrides (prices, ministers, policies)
    fetch('admin-config.json')
      .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then(cfg => {
        if (cfg.prices) {
          const ledColors = { 'Fast Charger': 'led-blue', 'Charge from Grid': 'led-teal', 'Solar Power': 'led-green', 'Solar Sharer (3 hrs free)': 'led-green' };
          cfg.prices.forEach(p => {
            const row = fuelRows.find(r => r.name === p.name);
            if (row) row.rawPrice = p.price;
          });
          rebuildSign();
        }
        if (cfg.ministers) {
          ministers.length = 0;
          cfg.ministers.forEach(m => ministers.push(m));
        }
        if (cfg.policies) {
          policies.length = 0;
          cfg.policies.forEach(p => policies.push({ id: p.id || '', label: p.text || p.label, checked: p.checked }));
        }
        renderConfig();
      })
      .catch(() => {}); // No admin config, use defaults

    buildSign();
    renderConfig();
    renderPrices();
    // Kick off the spin-up animation for petrol prices
    requestAnimationFrame(tickSpin);
  </script>

</body>
</html>
